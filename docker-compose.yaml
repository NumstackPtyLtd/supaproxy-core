services:
  mysql:
    image: mysql:8.0
    container_name: supaproxy-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD}
      MYSQL_DATABASE: supaproxy
    ports:
      - "3308:3306"
    volumes:
      - supaproxy-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: supaproxy-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - supaproxy-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build: .
    container_name: supaproxy-server
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file: .env
    environment:
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      QUEUE_HOST: redis
      QUEUE_PORT: 6379
      SESSION_HOST: redis
      SESSION_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  supaproxy-mysql-data:
  supaproxy-redis-data:
